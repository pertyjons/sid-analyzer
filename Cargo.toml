[workspace]
resolver = "3"
members = ["crates/analyzer"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
description = "Analyze Commodore 64 SID files and export musical structure, MIDI, and Pertylizer projects"
repository = "https://github.com/pertyjons/sid-analyzer"
license = "GPL-3.0-or-later"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
encoding_rs = "0.8.35"
mos6502 = "0.10.1"
midly = "0.5.3"
md-5 = "0.11.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rayon = "1.12.0"
walkdir = "2.5.0"
